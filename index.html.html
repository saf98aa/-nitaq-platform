<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NITAQ | نطاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#142D4E; --primary-600:#0b1c33; --primary-100:#e7ebf0;
  --accent:#168C88; --accent-dark:#0f6b68; --accent-100:#e3f3f2;
  --gold:#D6A84F;
  --bg:#F3F5F7; --surface:#ffffff; --text:#17212c; --text-muted:#5c6b78; --border:#e2e7ec;
  --success:#2f7d4f; --success-bg:#e7f4ec;
  --warning:#9a6b0c; --warning-bg:#fbf1dc;
  --error:#ae3b2e; --error-bg:#fbeae8;
  --info:#168C88; --info-bg:#e3f3f2;
  --muted-bg:#eef0f2;
  --sidebar-bg:var(--primary); --sidebar-text:#ffffff; --sidebar-text-muted:rgba(255,255,255,.62);
  --sidebar-active-bg:rgba(255,255,255,.14); --sidebar-hover-bg:rgba(255,255,255,.07);
  --radius:14px; --radius-sm:10px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1118; --surface:#121a24; --text:#eef2f0; --text-muted:#93a0ab; --border:#223040; --primary-100:#1b2838; --muted-bg:#17212c; --accent-100:#11302e; --accent-dark:#4fc4bf;
  }
}
:root[data-theme="dark"]{ --bg:#0b1118; --surface:#121a24; --text:#eef2f0; --text-muted:#93a0ab; --border:#223040; --primary-100:#1b2838; --muted-bg:#17212c; --accent-100:#11302e; --accent-dark:#4fc4bf; }
*{box-sizing:border-box;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;}
body[dir="rtl"]{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3{margin:0;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;flex:none;background:var(--sidebar-bg);border-inline-end:1px solid rgba(255,255,255,.08);padding:18px 14px;display:flex;flex-direction:column;gap:18px;}
.brand{display:flex;align-items:center;gap:10px;padding-inline-start:4px;}
.brand .mark{width:34px;height:34px;border-radius:9px;flex:none;display:flex;overflow:hidden;}
.brand .name{font-weight:700;font-size:14px;line-height:1.25;color:var(--sidebar-text);}
.brand .sub{font-size:11px;color:var(--sidebar-text-muted);}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border:none;background:none;border-radius:var(--radius-sm);color:var(--sidebar-text-muted);font-size:14px;}
.nav button .ic{width:18px;text-align:center;flex:none;}
.nav button.active{background:var(--sidebar-active-bg);color:#fff;font-weight:600;border-inline-start:3px solid var(--accent);padding-inline-start:9px;}
.nav button:not(.active):hover{background:var(--sidebar-hover-bg);color:#fff;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;}
.topbar .org{font-size:13px;color:var(--text-muted);}
.spacer{flex:1;}
.iconbtn{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:16px;}
.dot{position:absolute;top:4px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--error);border:2px solid var(--surface);}
.langbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-100);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.hamburger{display:none;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);width:36px;height:36px;align-items:center;justify-content:center;}
.content{padding:20px;max-width:1080px;margin:0 auto;width:100%;}
.pagehead{margin-bottom:18px;}
.pagehead h1{font-size:21px;}
.pagehead p{color:var(--text-muted);font-size:14px;margin-top:4px;}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px;}
.stat{background:var(--surface);border:1px solid var(--border);border-inline-start:3px solid var(--accent);border-radius:var(--radius);padding:12px 14px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{font-size:12px;color:var(--text-muted);margin-top:2px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.section h2{font-size:15px;margin-bottom:12px;}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px;}
.qa{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:start;}
.qa .ic{font-size:18px;color:var(--accent);}
.qa .t{font-weight:600;font-size:13px;margin-top:8px;}
.qa:hover{border-color:var(--accent);}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th{text-align:start;color:var(--text-muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);}
.tbl td{padding:10px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr.clickable:hover{background:var(--muted-bg);cursor:pointer;}
.badge{display:inline-flex;padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.b-draft{background:var(--muted-bg);color:var(--text-muted);}
.b-submitted{background:var(--info-bg);color:var(--info);}
.b-under_review{background:var(--warning-bg);color:var(--warning);}
.b-requires_action{background:var(--error-bg);color:var(--error);}
.b-approved{background:var(--success-bg);color:var(--success);}
.b-rejected{background:var(--error-bg);color:var(--error);}
.b-cancelled{background:var(--muted-bg);color:var(--text-muted);}
.b-stage1_approved{background:var(--info-bg);color:var(--info);}
.b-suspended{background:var(--warning-bg);color:var(--warning);}
.notif-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.notif-row:last-child{border-bottom:none;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
.notif-row .t{font-size:13.5px;font-weight:600;}
.notif-row .d{font-size:12px;color:var(--text-muted);margin-top:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.toolbar input,.toolbar select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:9px 12px;font-size:13.5px;}
.toolbar input{flex:1;min-width:160px;}
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-weight:600;font-size:13.5px;}
.btn-ghost{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:10px 20px;font-weight:600;font-size:13.5px;color:var(--text);}
.linkbtn{background:none;border:none;color:var(--accent-dark);font-weight:600;font-size:13px;padding:0;}
@media(max-width:860px){
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:-270px;width:250px;z-index:40;transition:inset-inline-start .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));}
  .sidebar.open{inset-inline-start:0;box-shadow:0 0 0 2000px rgba(0,0,0,.35);}
  .hamburger{display:flex;}
}
@media(max-width:620px){
  .tbl thead{display:none;}
  .tbl, .tbl tbody, .tbl tr, .tbl td{display:block;width:100%;}
  .tbl tr{border:1px solid var(--border);border-radius:var(--radius-sm);margin-block-end:10px;padding:8px 10px;}
  .tbl td{border:none;padding:4px 2px;display:flex;justify-content:space-between;gap:10px;}
  .tbl td::before{content:attr(data-label);font-weight:600;color:var(--text-muted);font-size:12px;}
}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49;}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,92vw);background:var(--surface);z-index:50;padding:18px;overflow-y:auto;padding-top:calc(18px + env(safe-area-inset-top,0px));}
.drawer h2{font-size:17px;margin-bottom:4px;}
.drawer .ref{color:var(--text-muted);font-size:13px;margin-bottom:14px;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.kv .k{color:var(--text-muted);}
.timeline{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
.tl-item{display:flex;gap:10px;font-size:13px;}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:4px;flex:none;}
.tl-item .d{color:var(--text-muted);font-size:12px;}
.closex{position:absolute;top:14px;inset-inline-end:14px;border:none;background:var(--muted-bg);width:30px;height:30px;border-radius:50%;}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 26px;}
.login-card .mark{width:44px;height:44px;border-radius:11px;overflow:hidden;display:flex;margin-bottom:14px;}
.login-card h1{font-size:18px;}
.login-card p.desc{color:var(--text-muted);font-size:13.5px;margin:6px 0 20px;line-height:1.5;}
.nafath{width:100%;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:12px;font-weight:700;font-size:14px;margin-bottom:10px;}
.sep{text-align:center;color:var(--text-muted);font-size:12px;margin:14px 0;}
.loginfoot{margin-top:18px;text-align:center;font-size:12px;color:var(--text-muted);}
.loginfoot a{color:var(--accent-dark);text-decoration:none;}
.simnote{background:var(--info-bg);color:var(--info);font-size:12px;border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:14px;}
.placeholder{text-align:center;padding:60px 20px;color:var(--text-muted);}
.placeholder .ic{font-size:34px;margin-bottom:10px;}
.langswitch-login{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));inset-inline-end:16px;}
.steps{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;}
.stepitem{flex:1;min-width:76px;text-align:center;font-size:11px;color:var(--text-muted);}
.stepitem .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--muted-bg);align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-bottom:4px;}
.stepitem.cur .num{background:var(--accent);color:#fff;}
.stepitem.done .num{background:var(--success);color:#fff;}
.stepitem.cur .lab{color:var(--text);font-weight:600;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text-muted);}
.input{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:9px 12px;font-size:13.5px;font-family:inherit;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media(max-width:620px){.grid2{grid-template-columns:1fr;}}
.chipbtn{display:inline-flex;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);font-size:12.5px;}
.chipbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.card-row{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;}
.err{color:var(--error);font-size:12px;margin-top:4px;}
</style>
</head>

function validateStep(n){var e={};

 if(n===2){if(!wiz.purpose)e.purpose=1;if(wiz.purpose==='other'&&!wiz.purposeOther)e.purposeOther=1;if(!wiz.missionTitle)e.missionTitle=1;if(!wiz.location)e.location=1;}
 if(n===3){if(!wiz.startDate)e.startDate=1;if(!wiz.endDate)e.endDate=1;if(wiz.startDate&&wiz.endDate&&wiz.endDate<wiz.startDate)e.endDate=2;if(wiz.entryTime&&wiz.exitTime&&wiz.startDate===wiz.endDate&&wiz.exitTime<=wiz.entryTime)e.exitTime=1;if(!wiz.frequency)e.frequency=1;}
 if(n===4){if(wiz.drivers.length===0)e.drivers=1;}
 if(n===5){if(wiz.vehicles.length===0)e.vehicles=1; var plates=wiz.vehicles.map(function(v){return v.plate;}); if(new Set(plates).size!==plates.length)e.plateDup=1;}
 if(n===6){if(wiz.decl.indexOf(false)!==-1)e.decl=1;}
 return e;}

  +'<div class="section"><h2>'+t('recentTitle')+'</h2>'+reqTable(REQUESTS.slice(0,4))+'</div>'
  +'<div class="section"><h2>'+t('notifTitle')+'</h2>'
    +NOTIFICATIONS.slice(0,5).map(n=>'<div class="notif-row"><div class="notif-dot"></div><div><div class="t">'+n.t[state.lang]+'</div><div class="d">'+n.d[state.lang]+'</div></div></div>').join('')
  +'</div>'
  +shellEnd;
  return html;
}

function reqTable(list){
  if(!list.length) return '<p style="color:var(--text-muted);font-size:13.5px">'+(state.lang==='ar'?'لا توجد نتائج':'No results')+'</p>';
  return '<table class="tbl"><thead><tr><th>'+t('colReqNum')+'</th><th>'+t('colPurpose')+'</th><th>'+t('colLocation')+'</th><th>'+t('colSubmitted')+'</th><th>'+t('colPeriod')+'</th><th>'+t('colStatus')+'</th><th>'+t('colActions')+'</th></tr></thead><tbody>'
  +list.map(r=>'<tr class="clickable" onclick="openReq(\''+r.id+'\')">'
    +'<td data-label="'+t('colReqNum')+'">'+r.id+'</td>'
    +'<td data-label="'+t('colPurpose')+'">'+r.purpose[state.lang]+'</td>'
    +'<td data-label="'+t('colLocation')+'">'+r.loc[state.lang]+'</td>'
    +'<td data-label="'+t('colSubmitted')+'">'+r.date+'</td>'
    +'<td data-label="'+t('colPeriod')+'">'+r.period[state.lang]+'</td>'
    +'<td data-label="'+t('colStatus')+'">'+statBadge(r.status)+'</td>'
    +'<td data-label="'+t('colActions')+'"><button class="linkbtn" onclick="event.stopPropagation();openReq(\''+r.id+'\')">'+t('view')+'</button></td>'
  +'</tr>').join('')+'</tbody></table>';
}

function renderRequests(){
  const list=filteredReqs();
  const statuses=["draft","submitted","under_review","requires_action","approved","rejected","cancelled"];
  let html=shellStart()
  +'<div class="pagehead" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">'
    +'<div><h1>'+t('reqTitle')+'</h1><p>'+t('reqDesc')+'</p></div>'
    +'<button class="btn-primary" onclick="go(\'newreq\')">'+t('newReqBtn')+'</button>'
  +'</div>'
  +'<div class="toolbar">'
    +'<input placeholder="'+t('searchPh')+'" value="'+state.search+'" oninput="onSearch(this.value)">'
    +'<select onchange="onFilter(this.value)">'
      +'<option value="">'+t('allStatus')+'</option>'
      +statuses.map(s=>'<option value="'+s+'" '+(state.statusFilter===s?'selected':'')+'>'+t('st_'+s)+'</option>').join('')
    +'</select>'
  +'</div>'
  +'<div class="section">'+reqTable(list)+'</div>'
  +shellEnd;
  if(state.openReqId){
    const r=REQUESTS.find(x=>x.id===state.openReqId);
    html+='<div class="drawer-backdrop" onclick="closeDrawer()"></div><div class="drawer">'
      +'<button class="closex" onclick="closeDrawer()">✕</button>'
      +'<h2>'+r.purpose[state.lang]+'</h2><div class="ref">'+t('drawerRef')+': '+r.id+'</div>'
      +statBadge(r.status)
      +'<div style="margin-top:14px">'
        +'<div class="kv"><div class="k">'+t('colOrg')+'</div><div>'+r.org[state.lang]+'</div></div>'
        +'<div class="kv"><div class="k">'+t('colLocation')+'</div><div>'+r.loc[state.lang]+'</div></div>'
        +'<div class="kv"><div class="k">'+t('colSubmitted')+'</div><div>'+r.date+'</div></div>'
        +'<div class="kv"><div class="k">'+t('colPeriod')+'</div><div>'+r.period[state.lang]+'</div></div>'
      +'</div>'
      +'<div class="timeline"><h2 style="font-size:14px;margin-bottom:8px">'+t('timeline')+'</h2>'
        +'<div class="tl-item"><div class="tl-dot"></div><div><div>'+t('tl1')+'</div><div class="d">'+r.date+'</div></div></div>'
        +'<div class="tl-item"><div class="tl-dot"></div><div><div>'+t('tl2')+'</div></div></div>'
        +(r.status==='requires_action'?'<div class="tl-item"><div class="tl-dot" style="background:var(--warning)"></div><div><div>'+t('tl3')+'</div></div></div>':'')
      +'</div>'
    +(r.status==='draft'?'<button class="btn-primary" style="width:100%;margin-top:14px" onclick="closeDrawer();continueDraft(\''+r.id+'\')">'+t('wzContinueDraft')+'</button>':'')
    +(['submitted','under_review'].indexOf(r.status)>-1?'<button class="btn-primary" style="width:100%;margin-top:14px" onclick="approveRequest(\''+r.id+'\')">'+t('approveDemo')+'</button>':'')
    +'</div>';
  }
  return html;
}

function renderPlaceholder(label){
  return shellStart()
  +'<div class="pagehead"><h1>'+label+'</h1></div>'
  +'<div class="section placeholder"><div class="ic">🚧</div><h2>'+t('placeholderTitle')+'</h2><p style="margin-top:6px">'+t('placeholderDesc')+'</p></div>'
  +shellEnd;
}

function render(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  document.body.dir=document.documentElement.dir;
  document.title=t('appName');
  let html;
  if(state.view==='login') html=renderLogin();
  else if(state.view==='dashboard') html=renderDashboard();
  else if(state.view==='requests') html=renderRequests();
  else if(state.view==='permits') html=renderPermits();
  else if(state.view==='reviewqueue') html=renderReviewQueue();
  else if(state.view==='register') html=renderPlaceholder(t('navRegister'));
  else if(state.view==='verify') html=renderVerify();
  else if(state.view==='newreq') html=renderWizard();
  else if(state.view==='confirm') html=renderConfirm();
  else if(state.view==='profile') html=renderPlaceholder(t('navProfile'));
  else if(state.view==='help') html=renderPlaceholder(t('navHelp'));
  else html=renderLogin();
  document.getElementById('app').innerHTML=html;
}
render();
</script>
</body>
</html>
